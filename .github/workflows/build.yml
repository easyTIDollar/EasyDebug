name: Android CI/CD Build

# 触发条件：当推送到 main 分支，或者提交 Pull Request 时触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取你的代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 配置 Java 环境 (Android Gradle 8+ 需要 Java 17 来运行构建)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. 赋予 gradlew 执行权限 (防止在 Linux 上报权限错误)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 执行 Gradle 打包命令 (打包 Debug 版 APK)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. 将打包好的 APK 上传到 GitHub Artifacts (供你下载)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyDebug-APK
          # 告诉 GitHub 动作去哪里找打包好的 APK
          path: app/build/outputs/apk/debug/*.apk
          # 保存时间：默认 90 天，这里设置为 30 天即可
          retention-days: 30